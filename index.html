<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f5f5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>GameCenter</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 24px 18px;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      color: #222; background: #f5f5f5;
    }
    h1 { margin: 0 0 22px; font-size: 26px; }
    .game-list { max-width: 560px; margin: 0 auto; }
    .game-button {
      display: flex; align-items: center; justify-content: space-between;
      width: 100%; padding: 18px 16px; margin: 0 0 10px;
      border: 1px solid #ddd; border-radius: 10px;
      background: #fff; color: inherit; text-align: left;
      font: inherit; font-size: 17px; cursor: pointer;
    }
    .game-button:active { background: #eee; }
    .arrow { color: #888; }
    #play-screen { display: none; position: fixed; inset: 0; background: #fff; }
    #play-screen.active { display: flex; flex-direction: column; }
    .topbar {
      flex: 0 0 auto; display: flex; align-items: center;
      min-height: 52px; padding: 6px 12px;
      border-bottom: 1px solid #ddd; background: #f7f7f7;
    }
    #back-button {
      border: 0; border-radius: 7px; padding: 9px 13px;
      background: #333; color: #fff; font: inherit; cursor: pointer;
    }
    #game-title { margin-left: 12px; font-weight: 600; }
    #game-frame { width: 100%; flex: 1 1 auto; border: 0; background: #fff; }
  </style>
</head>
<body>
  <main class="game-list" id="home-screen">
    <h1>GameCenter</h1>
    <button class="game-button" type="button" data-game="colorsort">
      <span>カラーソート</span><span class="arrow">›</span>
    </button>
  </main>

  <section id="play-screen" aria-label="ゲーム画面">
    <div class="topbar">
      <button id="back-button" type="button">‹ 一覧へ戻る</button>
      <span id="game-title">カラーソート</span>
    </div>
    <iframe id="game-frame" title="ゲーム"></iframe>
  </section>

  <script>
    (() => {
      const home = document.getElementById('home-screen');
      const play = document.getElementById('play-screen');
      const frame = document.getElementById('game-frame');
      const back = document.getElementById('back-button');

      document.querySelectorAll('[data-game]').forEach(button => {
        button.addEventListener('click', () => {
          const game = button.dataset.game;
          const names = { colorsort: 'カラーソート' };
          document.getElementById('game-title').textContent = names[game] || game;
          frame.src = `./games/${game}/index.html`;
          home.hidden = true;
          play.classList.add('active');
        });
      });

      back.addEventListener('click', () => {
        frame.src = 'about:blank';
        play.classList.remove('active');
        home.hidden = false;
      });

      if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./service-worker.js').catch(error => {
            console.error('Service Worker registration failed:', error);
          });
        });
      }
    })();
  </script>
</body>
</html>
