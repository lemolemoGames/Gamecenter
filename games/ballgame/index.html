<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>つむつむしないやつ</title>
    <style>
        /* はてなブログの他の要素に影響を与えないよう、ゲーム全体を専用のコンテナ内にカプセル化 */
        #game-app-container {
            width: 100%;
            max-width: 400px;
            margin: 0 auto;
            position: relative;
            background-color: #1a1a1a;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            border-radius: 16px;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        #game-app-container .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background-color: #2a2a2a;
            color: #ffffff;
            border-bottom: 2px solid #333;
        }

        #game-app-container .score-display {
            font-size: 18px;
            font-weight: bold;
        }

        #game-app-container .score-val {
            color: #00ffcc;
            font-size: 22px;
            margin-left: 4px;
        }

        #game-app-container .status-message {
            font-size: 14px;
            color: #ffcc00;
            font-weight: bold;
        }

        /* ポーズボタンのスタイリング */
        #game-app-container .pause-btn {
            background-color: #444;
            color: #fff;
            border: 1px solid #555;
            padding: 4px 12px;
            font-size: 12px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
        }

        #game-app-container .pause-btn:hover {
            background-color: #555;
        }

        /* 物理演算を描画するCanvasのラッパー（iPhone16の画面比率を意識した縦長） */
        #game-app-container .canvas-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 2 / 3;
            background-color: #121212;
        }

        #game-app-container canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* 共通オーバーレイ画面（ゲームオーバー・スタート・ポーズ） */
        #game-app-container .overlay {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            text-align: center;
            color: #ffffff;
            z-index: 10;
            padding-top: 40%;
        }

        #game-app-container .overlay h2 {
            font-size: 28px;
            color: #ff3366;
            margin: 0 0 10px 0;
            text-shadow: 0 0 10px rgba(255, 51, 102, 0.5);
        }

        #game-app-container .overlay p {
            font-size: 16px;
            margin: 0 0 20px 0;
            color: #cccccc;
        }

        #game-app-container .action-btn {
            background-color: #00ffcc;
            color: #121212;
            border: none;
            padding: 12px 32px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(0, 255, 204, 0.3);
        }

        /* スタート画面専用の特別ネオンカラー */
        #game-app-container #game-start-overlay h2 {
            color: #00ffcc;
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.5);
        }
    </style>
</head>

<body>
    <p> </p>
    <p>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    </p>
    <div id="game-app-container">
        <div class="game-header">
            <div class="score-display">SCORE:<span id="game-score-val" class="score-val">0</span></div>
            <div id="game-status-msg" class="status-message">START待ち...</div>
            <button id="game-pause-toggle-btn" class="pause-btn" style="display: none;">PAUSE</button>
        </div>
        <div class="canvas-wrapper">
            <div id="game-canvas-container"></div>
            <div id="game-start-overlay" class="overlay" style="display: block;">
                <h2>HARVEST DROPS</h2>
                <p>つむつむしない物理パズル</p>
                <button id="game-start-btn" class="action-btn">GAME START</button>
            </div>
            <div id="game-pause-overlay" class="overlay">
                <h2 style="color: #ffcc00; text-shadow: 0 0 10px rgba(255, 204, 0, 0.5);">PAUSED</h2>
                <p>一時停止中</p>
                <button id="game-resume-btn" class="action-btn">再開する</button>
            </div>
            <div id="game-overlay" class="overlay">
                <h2>GAME OVER</h2>
                <p>デッドラインを超えてしまいました</p>
                <p>FINAL SCORE: <span id="game-final-score" style="color: #00ffcc; font-weight: bold;">0</span></p>
                <button id="game-restart-btn" class="action-btn">もう一度遊ぶ</button>
            </div>
        </div>
    </div>

    <script>
        (function () {
            // ==========================================
            // ① 調整用パラメータ設定 (マジックナンバーの完全排除)
            // ==========================================
            const CONFIG = {
                WIDTH: 400,                // ゲーム内の論理幅
                HEIGHT: 600,               // ゲーム内の論理高さ
                DROP_RADIUS: 15,           // 通常ドロップの半径
                OBSTACLE_RADIUS: 18,       // お邪魔ドロップ（岩）の半径
                INITIAL_DROP_COUNT: 50,    // 初期ドロップ数
                DROP_COLORS: [
                    '#db6d83',             // ピンク
                    '#6fa8dc',             // ブルー
                    '#4ad600',             // グリーン
                    '#f7ee4a'              // イエロー
                ],
                OBSTACLE_COLOR: '#555555', // お邪魔ドロップのベース色
                DEADLINE_Y: 120,           // 警告ラインのY座標
                DEADLINE_TIME_LIMIT: 3000, // ラインを超えてからゲームオーバーまでの時間 (ミリ秒)
                RISE_INTERVAL: 7000,       // 下からお邪魔がせり上がる間隔 (ミリ秒)
                RISE_COUNT: 10,            // 1回にせり上がるお邪魔ドロップの数
                SPAWN_INTERVAL: 2000,      // 通常ドロップの補充間隔 (ミリ秒)
                SPAWN_COUNT: 10,           // 2秒ごとに一気にドバッと落とす個数
                MATCH_DISTANCE_BUFFER: 6   // さめがめ接触判定時の許容誤差(px)
            };

            // ==========================================
            // ② アプリケーションの状態管理（ステート）
            // ==========================================
            let engine, world, render, runner;
            let drops = [];
            let score = 0;
            let isGameOver = false;
            let isPaused = false;
            let hasStarted = false;
            let deadlineStartTime = null;

            let riseTimer = null;
            let spawnTimer = null;
            let updateLoopId = null;

            // ==========================================
            // ③ メイン初期化＆スタート処理
            // ==========================================
            function startGame() {
                hasStarted = true;
                isPaused = false;
                isGameOver = false;
                score = 0;
                drops = [];
                deadlineStartTime = null;

                document.getElementById('game-start-overlay').style.display = 'none';
                document.getElementById('game-pause-overlay').style.display = 'none';
                document.getElementById('game-overlay').style.display = 'none';
                document.getElementById('game-score-val').innerText = score;
                document.getElementById('game-status-msg').innerText = "ドロップ収穫中...";
                document.getElementById('game-status-msg').style.color = "#ffcc00";

                const pauseToggleBtn = document.getElementById('game-pause-toggle-btn');
                pauseToggleBtn.style.display = 'block';
                pauseToggleBtn.innerText = "PAUSE";

                const container = document.getElementById('game-canvas-container');
                container.innerHTML = '';

                const Engine = Matter.Engine,
                    Render = Matter.Render,
                    Runner = Matter.Runner,
                    Composite = Matter.Composite,
                    Bodies = Matter.Bodies;

                engine = Engine.create({ gravity: { y: 1.0 } });
                world = engine.world;

                // レンダラー設定
                render = Render.create({
                    element: container,
                    engine: engine,
                    options: {
                        width: CONFIG.WIDTH,
                        height: CONFIG.HEIGHT,
                        wireframes: false,
                        background: '#121212'
                    }
                });
                Render.run(render);

                // 毎フレームのレンダリング後にツヤツヤ処理を上書き
                Matter.Events.on(render, 'afterRender', function () {
                    drawCustomGlowDrops();
                });

                runner = Runner.create();
                Runner.run(runner, engine);

                // 外枠（左右の壁と底面）
                const wallOptions = { isStatic: true, friction: 0.1, render: { fillStyle: '#2a2a2a' } };
                const ground = Bodies.rectangle(CONFIG.WIDTH / 2, CONFIG.HEIGHT + 30, CONFIG.WIDTH * 2, 60, wallOptions);
                const leftWall = Bodies.rectangle(-30, CONFIG.HEIGHT / 2, 60, CONFIG.HEIGHT * 2, wallOptions);
                const rightWall = Bodies.rectangle(CONFIG.WIDTH + 30, CONFIG.HEIGHT / 2, 60, CONFIG.HEIGHT * 2, wallOptions);

                Composite.add(world, [ground, leftWall, rightWall]);

                // 初期ドロップ生成
                for (let i = 0; i < CONFIG.INITIAL_DROP_COUNT; i++) {
                    spawnNormalDrop();
                }

                // タイマー系のアクティベート
                startTimers();

                // タップイベント登録（一度だけ登録されるように配慮）
                render.canvas.removeEventListener('click', handleCanvasClick);
                render.canvas.removeEventListener('touchstart', handleCanvasTouch);
                render.canvas.addEventListener('click', handleCanvasClick);
                render.canvas.addEventListener('touchstart', handleCanvasTouch, { passive: true });

                // ループ処理開始
                if (updateLoopId) cancelAnimationFrame(updateLoopId);
                updateLoopId = requestAnimationFrame(checkGameStatusLoop);
            }

            // タイマー一括起動パッチ
            function startTimers() {
                if (riseTimer) clearInterval(riseTimer);
                if (spawnTimer) clearInterval(spawnTimer);
                riseTimer = setInterval(triggerObstacleRise, CONFIG.RISE_INTERVAL);
                spawnTimer = setInterval(autoReplenishDrops, CONFIG.SPAWN_INTERVAL);
            }

            // タイマー一括停止パッチ
            function stopTimers() {
                clearInterval(riseTimer);
                clearInterval(spawnTimer);
                riseTimer = null;
                spawnTimer = null;
            }

            // ==========================================
            // ⏸️ ポーズ（一時停止）制御ロジック
            // ==========================================
            function togglePause() {
                if (!hasStarted || isGameOver) return;

                if (!isPaused) {
                    // ポーズ状態にする
                    isPaused = true;
                    stopTimers();
                    if (updateLoopId) cancelAnimationFrame(updateLoopId);
                    // Matter.jsの物理エンジンの更新速度を0にしてフリーズさせる
                    engine.timing.timeScale = 0;

                    document.getElementById('game-pause-overlay').style.display = 'block';
                    document.getElementById('game-pause-toggle-btn').innerText = "RESUME";
                    document.getElementById('game-status-msg').innerText = "一時停止中";
                } else {
                    // 再開する
                    isPaused = false;
                    engine.timing.timeScale = 1; // 物理スピードを等倍に戻す
                    startTimers();

                    document.getElementById('game-pause-overlay').style.display = 'none';
                    document.getElementById('game-pause-toggle-btn').innerText = "PAUSE";
                    document.getElementById('game-status-msg').innerText = "ドロップ収穫中...";

                    // 前回のデッドライン計測をリセットして再開時の即死を防ぐ
                    deadlineStartTime = null;
                    updateLoopId = requestAnimationFrame(checkGameStatusLoop);
                }
            }

            // 【超重要】ブラウザのタブ切り替え（バックグラウンド移行）時の自動安全ポーズパッチ
            document.addEventListener('visibilitychange', function () {
                if (document.hidden && hasStarted && !isPaused && !isGameOver) {
                    togglePause(); // 裏に回ったら問答無用で安全にポーズ
                }
            });

            // ==========================================
            // ④ 特殊グラフィック描画
            // ==========================================
            function drawCustomGlowDrops() {
                const ctx = render.context;
                if (!ctx) return;

                const bodies = Matter.Composite.allBodies(world);

                bodies.forEach(function (d) {
                    if (d.isStatic) return;

                    const x = d.position.x;
                    const y = d.position.y;

                    ctx.save();
                    ctx.beginPath();

                    if (d.gameProps && d.gameProps.isObstacle) {
                        ctx.arc(x, y, CONFIG.OBSTACLE_RADIUS, 0, 2 * Math.PI);
                        const grad = ctx.createRadialGradient(x - 5, y - 5, 2, x, y, CONFIG.OBSTACLE_RADIUS);
                        grad.addColorStop(0, '#999999');
                        grad.addColorStop(0.2, '#444444');
                        grad.addColorStop(0.8, '#1a1a1a');
                        grad.addColorStop(1, '#0d0d0d');
                        ctx.fillStyle = grad;
                        ctx.fill();
                    } else if (d.gameProps) {
                        ctx.arc(x, y, CONFIG.DROP_RADIUS, 0, 2 * Math.PI);

                        const grad = ctx.createRadialGradient(x - 4, y - 4, 0.5, x, y, CONFIG.DROP_RADIUS);
                        grad.addColorStop(0, '#ffffff');
                        grad.addColorStop(0.05, '#ffffff');
                        grad.addColorStop(0.08, d.gameProps.color);
                        grad.addColorStop(0.8, adjustColorBrightness(d.gameProps.color, -20));
                        grad.addColorStop(0.98, adjustColorBrightness(d.gameProps.color, -40));
                        grad.addColorStop(1, 'transparent');

                        ctx.fillStyle = grad;
                        ctx.fill();
                    }

                    ctx.restore();
                });
            }

            // ==========================================
            // ⑤ ドロップ生成・補充ロジック
            // ==========================================
            function spawnNormalDrop() {
                if (isGameOver || isPaused) return;
                const Bodies = Matter.Bodies;
                const Composite = Matter.Composite;

                const x = Math.random() * (CONFIG.WIDTH - CONFIG.DROP_RADIUS * 4) + CONFIG.DROP_RADIUS * 2;
                const y = Math.random() * -100 - CONFIG.DROP_RADIUS;
                const colorIndex = Math.floor(Math.random() * CONFIG.DROP_COLORS.length);
                const color = CONFIG.DROP_COLORS[colorIndex];

                const drop = Bodies.circle(x, y, CONFIG.DROP_RADIUS, {
                    restitution: 0.2,
                    friction: 0.05,
                    density: 0.01,
                    render: { visible: false }
                });

                drop.gameProps = { isObstacle: false, color: color };
                drops.push(drop);
                Composite.add(world, drop);
            }

            function spawnObstacleDropAtBottom(xPosition) {
                if (isGameOver || isPaused) return;
                const Bodies = Matter.Bodies;
                const Composite = Matter.Composite;
                const y = CONFIG.HEIGHT - CONFIG.OBSTACLE_RADIUS * 2;

                const obstacle = Bodies.circle(xPosition, y, CONFIG.OBSTACLE_RADIUS, {
                    restitution: 0.1,
                    friction: 0.2,
                    density: 0.06,
                    render: { visible: false }
                });

                obstacle.gameProps = { isObstacle: true, color: CONFIG.OBSTACLE_COLOR };
                drops.push(obstacle);
                Composite.add(world, obstacle);
            }

            function autoReplenishDrops() {
                if (isGameOver || isPaused) return;
                for (let i = 0; i < CONFIG.SPAWN_COUNT; i++) {
                    spawnNormalDrop();
                }
            }

            function triggerObstacleRise() {
                if (isGameOver || isPaused) return;

                document.getElementById('game-status-msg').innerText = "下からせり上がり発生！";

                const segment = CONFIG.WIDTH / CONFIG.RISE_COUNT;
                for (let i = 0; i < CONFIG.RISE_COUNT; i++) {
                    const targetX = (segment * i) + (segment / 2) + (Math.random() * 10 - 5);
                    spawnObstacleDropAtBottom(targetX);
                }

                setTimeout(function () {
                    if (!isGameOver && !isPaused) document.getElementById('game-status-msg').innerText = "ドロップ収穫中...";
                }, 2000);
            }

            // ==========================================
            // ⑥ 座標検知 ＆ さめがめ探索ロジック
            // ==========================================
            function handleCanvasTouch(event) {
                if (isGameOver || isPaused || !event.touches[0]) return;
                const rect = event.target.getBoundingClientRect();
                const touchX = ((event.touches[0].clientX - rect.left) / rect.width) * CONFIG.WIDTH;
                const touchY = ((event.touches[0].clientY - rect.top) / rect.height) * CONFIG.HEIGHT;
                processClickOrTouch(touchX, touchY);
            }

            function handleCanvasClick(event) {
                if (isGameOver || isPaused) return;
                const rect = event.target.getBoundingClientRect();
                const clickX = ((event.clientX - rect.left) / rect.width) * CONFIG.WIDTH;
                const clickY = ((event.clientY - rect.top) / rect.height) * CONFIG.HEIGHT;
                processClickOrTouch(clickX, clickY);
            }

            function processClickOrTouch(targetX, targetY) {
                let clickedDrop = null;
                for (let i = 0; i < drops.length; i++) {
                    const d = drops[i];
                    const dist = Math.hypot(d.position.x - targetX, d.position.y - targetY);
                    const radius = d.gameProps.isObstacle ? CONFIG.OBSTACLE_RADIUS : CONFIG.DROP_RADIUS;
                    if (dist <= radius) {
                        clickedDrop = d;
                        break;
                    }
                }

                if (!clickedDrop || clickedDrop.gameProps.isObstacle) return;

                const connectedGroup = findConnectedDrops(clickedDrop);

                if (connectedGroup.length >= 2) {
                    executeVanish(connectedGroup);
                }
            }

            function findConnectedDrops(startDrop) {
                const targetColor = startDrop.gameProps.color;
                const queue = [startDrop];
                const visited = new Set([startDrop.id]);

                let head = 0;
                while (head < queue.length) {
                    const current = queue[head];
                    head++;

                    for (let i = 0; i < drops.length; i++) {
                        const other = drops[i];
                        if (visited.has(other.id) || other.gameProps.isObstacle) continue;
                        if (other.gameProps.color !== targetColor) continue;

                        const dist = Math.hypot(current.position.x - other.position.x, current.position.y - other.position.y);
                        const limitDist = CONFIG.DROP_RADIUS * 2 + CONFIG.MATCH_DISTANCE_BUFFER;

                        if (dist <= limitDist) {
                            visited.add(other.id);
                            queue.push(other);
                        }
                    }
                }
                return queue;
            }

            // ==========================================
            // ⑦ 消去 ＆ お邪魔巻き込み ＆ 爆風フォース演出
            // ==========================================
            function executeVanish(vanishGroup) {
                const Composite = Matter.Composite;
                const vanishIds = new Set(vanishGroup.map(d => d.id));

                const localObstaclesToVanish = [];
                for (let i = 0; i < drops.length; i++) {
                    const other = drops[i];
                    if (!other.gameProps.isObstacle) continue;

                    for (let j = 0; j < vanishGroup.length; j++) {
                        const vDrop = vanishGroup[j];
                        const dist = Math.hypot(other.position.x - vDrop.position.x, other.position.y - vDrop.position.y);
                        const limitDist = CONFIG.DROP_RADIUS + CONFIG.OBSTACLE_RADIUS + CONFIG.MATCH_DISTANCE_BUFFER;

                        if (dist <= limitDist) {
                            localObstaclesToVanish.push(other);
                            break;
                        }
                    }
                }

                vanishGroup.forEach(drop => Composite.remove(world, drop));
                localObstaclesToVanish.forEach(obs => Composite.remove(world, obs));

                drops = drops.filter(d => !vanishIds.has(d.id) && !localObstaclesToVanish.includes(d));

                const basePoints = vanishGroup.length * 10;
                const comboBonus = vanishGroup.length * vanishGroup.length * 5;
                const obstaclePoints = localObstaclesToVanish.length * 50;

                score += basePoints + comboBonus + obstaclePoints;
                document.getElementById('game-score-val').innerText = score;

                applyExplosionForce(vanishGroup);
            }

            function applyExplosionForce(vanishGroup) {
                if (vanishGroup.length === 0) return;
                const Body = Matter.Body;

                let sumX = 0, sumY = 0;
                vanishGroup.forEach(d => { sumX += d.position.x; sumY += d.position.y; });
                const centerX = sumX / vanishGroup.length;
                const centerY = sumY / vanishGroup.length;

                drops.forEach(d => {
                    const dx = d.position.x - centerX;
                    const dy = d.position.y - centerY;
                    const dist = Math.hypot(dx, dy);

                    if (dist < 160 && dist > 0) {
                        const forceMagnitude = (160 - dist) * 0.0003;
                        Body.applyForce(d, d.position, {
                            x: (dx / dist) * forceMagnitude,
                            y: (dy / dist) * forceMagnitude - 0.004
                        });
                    }
                });
            }

            // ==========================================
            // ⑧ 天井ライン監視 ＆ ゲームオーバー
            // ==========================================
            function checkGameStatusLoop() {
                if (isGameOver || isPaused) return;

                let isBreaching = false;
                for (let i = 0; i < drops.length; i++) {
                    if (drops[i].position.y < CONFIG.DEADLINE_Y && Math.abs(drops[i].velocity.y) < 0.2) {
                        isBreaching = true;
                        break;
                    }
                }

                const msgElement = document.getElementById('game-status-msg');

                if (isBreaching) {
                    if (deadlineStartTime === null) deadlineStartTime = Date.now();
                    const elapsed = Date.now() - deadlineStartTime;
                    const remaining = Math.ceil((CONFIG.DEADLINE_TIME_LIMIT - elapsed) / 1000);

                    msgElement.innerText = `⚠️ 危険! あと ${remaining} 秒 ⚠️`;
                    msgElement.style.color = "#ff3366";

                    if (elapsed >= CONFIG.DEADLINE_TIME_LIMIT) {
                        triggerGameOver();
                        return;
                    }
                } else {
                    deadlineStartTime = null;
                    if (msgElement.style.color !== "rgb(255, 204, 0)" && msgElement.innerText !== "下からせり上がり発生！") {
                        msgElement.style.color = "#ffcc00";
                        msgElement.innerText = "ドロップ収穫中...";
                    }
                }

                drawDeadlineOverlay();
                updateLoopId = requestAnimationFrame(checkGameStatusLoop);
            }

            function drawDeadlineOverlay() {
                if (!render || !render.context) return;
                const ctx = render.context;
                ctx.save();
                ctx.beginPath();
                ctx.setLineDash([6, 6]);
                ctx.moveTo(0, CONFIG.DEADLINE_Y);
                ctx.lineTo(CONFIG.WIDTH, CONFIG.DEADLINE_Y);
                ctx.strokeStyle = deadlineStartTime !== null ? '#ff3366' : '#555555';
                ctx.lineWidth = 2;
                ctx.stroke();
                ctx.restore();
            }

            function triggerGameOver() {
                isGameOver = true;
                stopTimers();
                if (updateLoopId) cancelAnimationFrame(updateLoopId);

                document.getElementById('game-final-score').innerText = score;
                document.getElementById('game-overlay').style.display = 'block';
                document.getElementById('game-pause-toggle-btn').style.display = 'none';
                document.getElementById('game-status-msg').innerText = "ゲームオーバー";
                document.getElementById('game-status-msg').style.color = "#ff3366";
            }

            // ==========================================
            // 💡 色の明るさを変える補助関数
            // ==========================================
            function adjustColorBrightness(hex, percent) {
                let R = parseInt(hex.substring(1, 3), 16);
                let G = parseInt(hex.substring(3, 5), 16);
                let B = parseInt(hex.substring(5, 7), 16);
                R = parseInt(R * (100 + percent) / 100);
                G = parseInt(G * (100 + percent) / 100);
                B = parseInt(B * (100 + percent) / 100);
                R = (R < 255) ? R : 255; G = (G < 255) ? G : 255; B = (B < 255) ? B : 255;
                R = (R > 0) ? R : 0; G = (G > 0) ? G : 0; B = (B > 0) ? B : 0;
                const rHex = (R.toString(16).length == 1) ? "0" + R.toString(16) : R.toString(16);
                const gHex = (G.toString(16).length == 1) ? "0" + G.toString(16) : G.toString(16);
                const bHex = (B.toString(16).length == 1) ? "0" + B.toString(16) : B.toString(16);
                return "#" + rHex + gHex + bHex;
            }

            // イベントハンドラーバインド
            document.getElementById('game-start-btn').addEventListener('click', startGame);
            document.getElementById('game-pause-toggle-btn').addEventListener('click', togglePause);
            document.getElementById('game-resume-btn').addEventListener('click', togglePause);
            document.getElementById('game-restart-btn').addEventListener('click', startGame);
        })();
    </script>
